<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invention Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#FFF8F0;--card:#FFFFFF;--text:#1A1A2E;--muted:#8A8A9A;--border:#E8E4DC;
    --green-bg:#EAFAF1;--green-border:#52BE80;--green-text:#1E8449;
    --accent:#FF6B6B;--accent2:#4ECDC4;--accent3:#FFE66D;--purple:#A855F7;
    --slot-empty:#F9F6F2;--slot-active:#EAFAF1;--slot-active-b:#52BE80;
    --radius:16px;--radius-sm:10px;
  }
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#D4C9BC 1px,transparent 1px);background-size:28px 28px;opacity:.35;pointer-events:none;z-index:0}
  .page{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:2rem 1.25rem 4rem}
  .header{text-align:center;margin-bottom:2rem}
  .header-tag{display:inline-block;background:var(--accent3);color:#5A4800;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:10px;border:1.5px solid #D4A800}
  .header h1{font-family:'Fredoka One',cursive;font-size:clamp(2.2rem,6vw,3.2rem);color:var(--text);line-height:1.1;margin-bottom:6px}
  .header h1 span{color:var(--accent)}
  .header p{font-size:15px;color:var(--muted);font-weight:600}
  .invention-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:2rem 1.5rem 1.5rem;text-align:center;margin-bottom:1.25rem;position:relative;overflow:hidden}
  .invention-card::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--purple))}
  .inv-emoji{font-size:56px;display:block;margin-bottom:12px;line-height:1}
  .inv-title{font-family:'Fredoka One',cursive;font-size:clamp(1.3rem,4vw,1.8rem);color:var(--text);line-height:1.3;margin-bottom:8px}
  .inv-meta{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-bottom:1.75rem;flex-wrap:wrap}
  .btn{font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;padding:12px 26px;border-radius:var(--radius-sm);border:2px solid transparent;cursor:pointer;transition:transform .1s;letter-spacing:.02em}
  .btn:active{transform:scale(.96)}
  .btn-generate{background:var(--text);color:#FFF;border-color:var(--text)}
  .btn-generate:hover{background:#2D2D4E}
  .btn-add{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border)}
  .btn-add:hover{background:#D5F5E3}
  .btn-add:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .list-heading{font-family:'Fredoka One',cursive;font-size:1.2rem;color:var(--text)}
  .list-counter{font-size:12px;font-weight:700;color:var(--muted);background:var(--border);padding:3px 12px;border-radius:20px;letter-spacing:.05em}
  .list-counter.full{background:var(--green-bg);color:var(--green-text);border:1.5px solid var(--green-border)}
  .list-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .slot{display:flex;align-items:center;gap:9px;background:var(--slot-empty);border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:9px 12px;min-height:52px;transition:border-color .15s,background .15s}
  .slot.filled{background:var(--card);border-style:solid;border-color:var(--border)}
  .slot.active{background:var(--slot-active);border-style:solid;border-color:var(--slot-active-b);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(82,190,128,.3)}50%{box-shadow:0 0 0 5px rgba(82,190,128,0)}}
  .slot-num{width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .slot-num.filled{background:#EAF3DE;color:var(--green-text)}
  .slot-num.active{background:var(--green-border);color:#fff}
  .slot-emoji{font-size:18px;flex-shrink:0}
  .slot-text{font-size:12px;font-weight:600;color:var(--text);line-height:1.35;flex:1}
  .slot-empty-text{font-size:12px;color:var(--muted);font-weight:600;flex:1}
  .slot-arrow{font-size:14px;color:var(--green-text);font-weight:700;flex-shrink:0}
  .full-msg{text-align:center;margin-top:14px;font-size:14px;font-weight:700;color:var(--green-text);min-height:22px;padding:8px 16px;border-radius:var(--radius-sm);background:transparent}
  .full-msg.show{background:var(--green-bg);border:1.5px solid var(--green-border)}
  .progress-wrap{height:6px;background:var(--border);border-radius:3px;margin-bottom:1.75rem;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--purple));border-radius:3px;transition:width .3s ease}
  .stats{text-align:center;font-size:11px;color:var(--muted);margin-top:1.5rem;font-weight:600}
  @media(max-width:480px){.list-grid{grid-template-columns:1fr}.btn{font-size:14px;padding:11px 20px}.inv-emoji{font-size:44px}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-tag">Design Thinking</div>
    <h1>Invention <span>Generator</span></h1>
    <p>Generate a silly invention — then pitch it to the class!</p>
  </div>
  <div class="invention-card">
    <span class="inv-emoji" id="inv-emoji">💡</span>
    <p class="inv-title" id="inv-title">Press generate to get started!</p>
    <p class="inv-meta" id="inv-meta">&nbsp;</p>
  </div>
  <div class="btn-row">
    <button class="btn btn-generate" id="btn-generate" onclick="doGenerate()">Generate</button>
    <button class="btn btn-add" id="btn-add" onclick="doAdd()" disabled>+ Add to list</button>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="list-header">
    <span class="list-heading">Shortlist</span>
    <span class="list-counter" id="list-counter">0 / 10</span>
  </div>
  <div class="list-grid" id="list-grid"></div>
  <div class="full-msg" id="full-msg"></div>
  <p class="stats" id="stats"></p>
</div>

function buildGrid(){
  const g=document.getElementById('list-grid');g.innerHTML='';
  for(let i=0;i<MAX;i++){
    const d=document.createElement('div');d.id='slot-'+i;d.className='slot';
    d.innerHTML=`<div class=slot-num id=snum-${i}>${i+1}</div><span class=slot-empty-text>waiting...</span>`;
    g.appendChild(d);
  }
}
function renderList(){
  for(let i=0;i<MAX;i++){
    const slot=document.getElementById('slot-'+i);
    const num=document.getElementById('snum-'+i);
    while(slot.children.length>1)slot.removeChild(slot.lastChild);
    if(list[i]){
      slot.className='slot filled';num.className='slot-num filled';
      const e=document.createElement('span');e.className='slot-emoji';e.textContent=list[i].emoji;
      const t=document.createElement('span');t.className='slot-text';t.textContent=list[i].text;
      slot.appendChild(e);slot.appendChild(t);
    }else if(i===nextSlot&&current){
      slot.className='slot active';num.className='slot-num active';
      const e=document.createElement('span');e.className='slot-emoji';e.textContent=current.emoji;
      const t=document.createElement('span');t.className='slot-text';t.textContent=current.text;
      const a=document.createElement('span');a.className='slot-arrow';a.textContent='←';
      slot.appendChild(e);slot.appendChild(t);slot.appendChild(a);
    }else{
      slot.className='slot';num.className='slot-num';
      const empty=document.createElement('span');empty.className='slot-empty-text';empty.textContent='waiting...';
      slot.appendChild(empty);
    }
  }
  document.getElementById('progress').style.width=(nextSlot/MAX*100).toFixed(0)+'%';
  const ctr=document.getElementById('list-counter');
  ctr.textContent=nextSlot+' / '+MAX;

}
function doGenerate(){
  if(nextSlot>=MAX){
    list=new Array(MAX).fill(null);nextSlot=0;
    document.getElementById('btn-generate').textContent='Generate';
    document.getElementById('full-msg').textContent='';
    document.getElementById('full-msg').className='full-msg';
  }
  let oi,ai;
  do{oi=Math.floor(Math.random()*objects.length);}while(oi===lastObj);
  do{ai=Math.floor(Math.random()*actions.length);}while(ai===lastAct);
  lastObj=oi;lastAct=ai;
  const [obj,emoji]=objects[oi];
  const text=obj.charAt(0).toUpperCase()+obj.slice(1)+' '+actions[ai];
  totalCount++;current={text,emoji};
  document.getElementById('inv-emoji').textContent=emoji;
  document.getElementById('inv-title').textContent=text;
  document.getElementById('inv-meta').textContent='Invention #'+totalCount;
  document.getElementById('btn-add').disabled=false;
  document.getElementById('full-msg').textContent='';
  document.getElementById('full-msg').className='full-msg';
  renderList();
}
function doAdd(){
  if(!current||nextSlot>=MAX)return;
  list[nextSlot]={...current};nextSlot++;current=null;

  renderList();
  if(nextSlot>=MAX){
